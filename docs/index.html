<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b10">
  <meta name="description" content="OMNIA is an independent journal exploring connections between science, technology, philosophy and the human experience.">
  <title>OMNIA — Look closer. Think wider.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="content/site.js" defer></script>
  <script src="content/generated-articles.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="#home" aria-label="OMNIA home"><span class="moon-mark" aria-hidden="true"></span><span class="brand-word">OMNIA<span>.</span></span></a>
      <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="siteNav">Menu</button>
      <nav class="nav-links" id="siteNav" aria-label="Main navigation">
        <a href="#journal">Journal</a><a href="#ideas">Ideas</a><a class="nav-about" href="#about">About OMNIA</a>
      </nav>
    </div>
  </header>
  <main id="main">
    <section class="hero" id="home">
      <div class="wrap hero-inner">
        <div class="eyebrow" id="heroEyebrow"></div>
        <h1><span id="heroLine1"></span><br><em id="heroLine2"></em></h1>
        <p class="hero-copy" id="heroDescription"></p>
        <div class="hero-bottom">
          <a class="primary-link" href="#journal"><span id="heroPrimary"></span><span aria-hidden="true">↗</span></a>
          <a class="quiet-link" href="#about"><span id="heroSecondary"></span> <span aria-hidden="true">→</span></a>
        </div>
      </div>
      <div class="hero-aside" aria-hidden="true">Curiosity · Connection · Perspective</div>
    </section>
    <section class="section" aria-labelledby="featuredHeading">
      <div class="wrap">
        <div class="section-heading"><div><div class="kicker" id="featuredKicker"></div><h2 id="featuredHeading"></h2></div><span class="section-index">01 / Perspective</span></div>
        <article class="feature">
          <div class="feature-visual" role="img" aria-label="A moonlike sphere crossed by a delicate orbital line"></div>
          <div class="feature-copy"><div class="topic" id="featuredTopic"></div><h3 id="featuredTitle"></h3><p id="featuredDescription"></p><div class="editorial-caption" id="featuredCaption"></div></div>
        </article>
      </div>
    </section>
    <section class="section journal-section" id="journal" aria-labelledby="journalHeading">
      <div class="wrap">
        <div class="section-heading"><div><div class="kicker" id="journalKicker"></div><h2 id="journalHeading"></h2><p class="section-note" id="journalDescription"></p></div><span class="section-index">02 / Discover</span></div>
        <div class="journal-tools">
          <div class="filters" role="group" aria-label="Filter ideas by subject">
            <button class="filter" type="button" data-filter="all" aria-pressed="true">All subjects</button>
            <button class="filter" type="button" data-filter="science" aria-pressed="false">Science</button>
            <button class="filter" type="button" data-filter="technology" aria-pressed="false">Technology</button>
            <button class="filter" type="button" data-filter="philosophy" aria-pressed="false">Philosophy</button>
          </div>
          <label class="search"><span aria-hidden="true">⌕</span><input id="ideaSearch" type="search" placeholder="Search ideas..." autocomplete="off" aria-label="Search ideas"></label>
        </div>
        <div class="card-grid" id="ideaGrid"></div>
        <div class="empty-state" id="emptyState">No ideas found. Try another search or choose a different subject.</div>
        <div class="results-status" id="resultsStatus" aria-live="polite"></div>
      </div>
    </section>
    <section class="section thoughts" id="ideas" aria-labelledby="thoughtsHeading">
      <div class="wrap thought-grid">
        <div><div class="kicker" id="thoughtsKicker"></div><h2 id="thoughtsHeading"></h2><p class="section-note" id="thoughtsDescription"></p></div>
        <div class="thought-list" id="thoughtList"></div>
      </div>
    </section>
    <section class="section" id="about" aria-labelledby="aboutHeading">
      <div class="wrap about-grid"><div><div class="kicker" id="aboutKicker"></div><h2 id="aboutHeading"></h2></div><div class="about-copy" id="aboutCopy"></div></div>
      <div class="wrap" style="margin-top:48px"><div class="about-emblem" role="img" aria-label="OMNIA wordmark framed by subtle orbital circles"><strong>OMNIA.</strong></div></div>
    </section>
  </main>
  <footer class="footer"><div class="wrap footer-inner"><div><span class="footer-brand">OMNIA.</span><span> &nbsp; <span id="footerTagline"></span></span></div><div class="footer-links"><a href="#about">About</a><a href="#home">Back to top ↑</a></div><span>© <span id="year"></span> OMNIA</span></div></footer>
</body>
</html>
